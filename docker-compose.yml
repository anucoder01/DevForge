version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: devforge-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: devforge
      POSTGRES_USER: devforge_user
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
